<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club 404</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
            display: flex; justify-content: center; align-items: center;
        }

        /* The Blurred Background Layer */
        .video-bg-blur {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            filter: blur(20px) brightness(0.6); /* Instagram-style blur */
            transform: scale(1.1); /* Prevents white edges from the blur */
            z-index: 1;
        }

        /* The Main Foreground Video */
        .video-main {
            position: relative;
            z-index: 2;
            width: 100vw;
            transition: all 0.5s ease;
        }

        /* DESKTOP: Trim 10% off top and bottom */
        @media (min-width: 769px) {
            .video-main {
                height: 80vh; /* Shows only 80% of screen height */
                object-fit: cover; /* Crops the 10% top/bottom to fill that 80vh */
            }
        }

        /* MOBILE: Full width with blur background */
        @media (max-width: 768px) {
            .video-main {
                height: auto; /* Maintains natural aspect ratio */
                object-fit: contain; /* Ensures full width is visible */
                box-shadow: 0 0 50px rgba(0,0,0,0.5); /* Adds depth over the blur */
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg-blur">
        <source src="Tennis98.mp4" type="video/mp4">
    </video>

    <video autoplay muted loop playsinline class="video-main" id="mainVideo">
        <source src="Tennis98.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        // Synchronize the two videos so the blur matches the foreground perfectly
        const v1 = document.querySelector('.video-bg-blur');
        const v2 = document.getElementById('mainVideo');

        v2.onplay = () => {
            v1.currentTime = v2.currentTime;
            v1.play();
        };
    </script>
</body>
</html>
