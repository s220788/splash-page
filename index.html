<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club 404</title>
    
    <link rel="icon" type="image/png" href="https://win98icons.alexmeub.com/icons/png/computer_explorer-4.png">

    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; 
            background-color: #006b67; 
            display: flex; justify-content: center; align-items: center;
        }

        /* --- DESKTOP SETTINGS --- */
        .video-bg-blur {
            display: none;
        }

        .video-main {
            position: relative;
            z-index: 2;
            width: 75vw;  
            height: 75vh; 
            object-fit: cover;
            /* Feathered edge applied to bottom and bottom corners */
            -webkit-mask-image: radial-gradient(ellipse 120% 140% at 50% 0%, black 80%, transparent 95%);
            mask-image: radial-gradient(ellipse 120% 140% at 50% 0%, black 80%, transparent 95%);
        }

        /* --- MOBILE SETTINGS --- */
        @media (max-width: 768px) {
            .video-bg-blur {
                display: block; 
                position: fixed;
                top: 0; left: 0;
                width: 100vw; height: 100vh;
                object-fit: cover;
                filter: blur(20px) brightness(0.7);
                transform: scale(1.1);
                z-index: 1;
                /* Background is solid to the edges */
            }

            .video-main {
                width: 100vw;
                height: auto; 
                object-fit: contain;
                z-index: 2;
                /* Mobile: Feathered edge applied ONLY to top, bottom and bottom corners of the frame */
                /* To fade both top and bottom on mobile, we use this centered ellipse */
                -webkit-mask-image: radial-gradient(ellipse 130% 120% at 50% 50%, black 65%, transparent 98%);
                mask-image: radial-gradient(ellipse 130% 120% at 50% 50%, black 65%, transparent 98%);
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg-blur" id="bgVideo">
        <source src="splash.mp4" type="video/mp4">
    </video>

    <video autoplay muted loop playsinline class="video-main" id="mainVideo">
        <source src="splash.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const vBg = document.getElementById('bgVideo');
        const vMain = document.getElementById('mainVideo');

        vMain.onplay = () => {
            if (window.innerWidth <= 768) {
                vBg.currentTime = vMain.currentTime;
                vBg.play();
            }
        };

        document.addEventListener('touchstart', () => {
            vMain.play();
            if (window.innerWidth <= 768) vBg.play();
        }, {once: true});
    </script>
</body>
</html>
