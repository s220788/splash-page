<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club 404</title>
    
    <link rel="icon" type="image/png" href="https://win98icons.alexmeub.com/icons/png/computer_explorer-4.png">

    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; 
            /* Updated background color to match the video bottom */
            background-color: #006b67; 
            display: flex; justify-content: center; align-items: center;
        }

        /* --- DESKTOP SETTINGS --- */
        .video-bg-blur {
            display: none; /* No blur background on desktop */
        }

        .video-main {
            position: relative;
            z-index: 2;
            width: 75vw;  /* 75% of screen width */
            height: 75vh; /* 75% of screen height */
            object-fit: cover; /* This performs the 10% top/bottom trim */
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- MOBILE SETTINGS --- */
        @media (max-width: 768px) {
            body, html {
                /* On mobile, we let the blur handle the edges */
                background-color: #000; 
            }

            .video-bg-blur {
                display: block; 
                position: fixed;
                top: 0; left: 0;
                width: 100vw; height: 100vh;
                object-fit: cover;
                filter: blur(20px) brightness(0.7);
                transform: scale(1.1);
                z-index: 1;
            }

            .video-main {
                width: 100vw;
                height: auto; 
                object-fit: contain;
                box-shadow: 0 0 30px rgba(0,0,0,0.5);
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg-blur" id="bgVideo">
        <source src="Tennis98.mp4" type="video/mp4">
    </video>

    <video autoplay muted loop playsinline class="video-main" id="mainVideo">
        <source src="Tennis98.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const vBg = document.getElementById('bgVideo');
        const vMain = document.getElementById('mainVideo');

        // Sync videos for mobile
        vMain.onplay = () => {
            if (window.innerWidth <= 768) {
                vBg.currentTime = vMain.currentTime;
                vBg.play();
            }
        };

        // Autoplay fix for mobile
        document.addEventListener('touchstart', () => {
            vMain.play();
            if (window.innerWidth <= 768) vBg.play();
        }, {once: true});
    </script>
</body>
</html>
