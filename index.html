<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club 404</title>
    
    <link rel="icon" type="image/png" href="https://win98icons.alexmeub.com/icons/png/computer_explorer-4.png">

    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
            display: flex; justify-content: center; align-items: center;
        }

        /* --- DESKTOP SETTINGS (Default) --- */
        .video-bg-blur {
            display: none; /* Hide blur on desktop */
        }

        .video-main {
            position: relative;
            z-index: 2;
            /* Scale to 75% of screen width */
            width: 75vw; 
            /* Show 75% height, but the object-fit crops the top/bottom */
            height: 75vh; 
            object-fit: cover;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
        }

        /* --- MOBILE SETTINGS --- */
        @media (max-width: 768px) {
            .video-bg-blur {
                display: block; /* Show blur only on mobile */
                position: fixed;
                top: 0; left: 0;
                width: 100vw; height: 100vh;
                object-fit: cover;
                filter: blur(20px) brightness(0.5);
                transform: scale(1.1);
                z-index: 1;
            }

            .video-main {
                width: 100vw;
                height: auto; /* Show full width on mobile */
                object-fit: contain;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg-blur" id="bgVideo">
        <source src="Tennis98.mp4" type="video/mp4">
    </video>

    <video autoplay muted loop playsinline class="video-main" id="mainVideo">
        <source src="Tennis98.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const vBg = document.getElementById('bgVideo');
        const vMain = document.getElementById('mainVideo');

        // Only sync if the background video is actually visible (Mobile)
        vMain.onplay = () => {
            if (window.innerWidth <= 768) {
                vBg.currentTime = vMain.currentTime;
                vBg.play();
            }
        };

        // Interaction fix for mobile autoplay
        document.addEventListener('touchstart', () => {
            vMain.play();
            if (window.innerWidth <= 768) vBg.play();
        }, {once: true});
    </script>
</body>
</html>
