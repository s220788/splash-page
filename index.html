<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; /* If video fails, it stays black */
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="Tennis98.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        // Force play if the browser tries to pause it on load
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('bg-video');
            video.play().catch(function(error) {
                console.log("Autoplay was prevented. User interaction might be required.");
            });
        });
    </script>

</body>
</html>
