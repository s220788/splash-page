<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club 404</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #000; 
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            /* Forces scaling up and cropping to fill the window */
            object-fit: cover; 
            z-index: -1;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="./Tennis98.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        // Some browsers are stubborn; this forces the video to try playing again
        window.onload = function() {
            var video = document.getElementById('bg-video');
            video.play().catch(function(e) {
                console.log("Autoplay blocked: ", e);
            });
        };
    </script>

</body>
</html>
