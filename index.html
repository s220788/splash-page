<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club 404</title>
    
    <link rel="icon" type="image/png" href="https://win98icons.alexmeub.com/icons/png/computer_explorer-4.png">

    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
            display: flex; justify-content: center; align-items: center;
        }

        /* The Blurred Background Layer (Instagram style) */
        .video-bg-blur {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            filter: blur(25px) brightness(0.5); 
            transform: scale(1.1); 
            z-index: 1;
        }

        /* The Main Foreground Video */
        .video-main {
            position: relative;
            z-index: 2;
            width: 100vw;
            transition: all 0.5s ease;
        }

        /* DESKTOP: Trim 10% off top and bottom by showing only 80% height */
        @media (min-width: 769px) {
            .video-main {
                height: 80vh; 
                object-fit: cover; 
            }
        }

        /* MOBILE: Full width with blur background */
        @media (max-width: 768px) {
            .video-main {
                height: auto; 
                object-fit: contain;
                box-shadow: 0 0 100px rgba(0,0,0,0.8);
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg-blur">
        <source src="Tennis98.mp4" type="video/mp4">
    </video>

    <video autoplay muted loop playsinline class="video-main" id="mainVideo">
        <source src="Tennis98.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        // Sync the two videos
        const v1 = document.querySelector('.video-bg-blur');
        const v2 = document.getElementById('mainVideo');

        v2.onplay = () => {
            v1.currentTime = v2.currentTime;
            v1.play();
        };

        // Fallback for mobile browsers that block dual-autoplay
        document.addEventListener('click', () => {
            v1.play();
            v2.play();
        }, {once: true});
    </script>
</body>
</html>
